<p-dialog 
  [header]="'Nota/Observatie programare finalizata'" 
  [(visible)]="visibleCompleteDialog" 
  [modal]="true" [style]="{ width: '500px' }" 
  [draggable]="false" 
  [resizable]="false"
>
  <form [formGroup]="setForm" (ngSubmit)="onSetAppointmentCompleted()" >
    <div class="flex flex-col gap-4">
      <div class="flex flex-row  items-center gap-2">
          <i class="pi pi-user"></i>
          <span class="font-bold whitespace-nowrap">{{fsv.customer_name}}</span>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-slate-700">Nota/Observatie:</label>
        <textarea pTextarea formControlName="appointment_overview"
          [placeholder]="!fsv.appointment_overview ? 'Nu exista informatii notate' : ''"
          [ngClass]="{'ng-invalid ng-dirty': fsc.appointment_overview?.invalid && (fsc.appointment_overview?.dirty || fsc.appointment_overview?.touched)}"
          rows="5" cols="30" 
        ></textarea>
      </div>
      @if (fsc.appointment_overview?.invalid && (fsc.appointment_overview?.dirty || fsc.appointment_overview?.touched) && fsc.appointment_overview?.hasError('maxlength')){
        <p-message severity="error" variant="simple" size="small">Lungimea maxima a campului este de 500 de caractere</p-message>                        
      }
      <div class="flex flex-row gap-1 justify-end ">
        <p-button 
            [label]="'Inchide'"
            [text]="'true'"
            severity="secondary" 
            (onClick)="visibleCompleteDialog.set(false)" 
            size="small"
        ></p-button>
        <p-button 
          type="submit"
          label="Salvează" 
          severity="success" 
          size="small"
          [loading]="isSavingCompleteStatus()"
        ></p-button>
      </div>
    </div>
  </form>
</p-dialog>
<!--           
    [label]="fsv.appointment_status ? 'Inchide' : 'Anuleaza'" 
    [text]="fsv.appointment_status ? 'false' : 'true'"
-->
