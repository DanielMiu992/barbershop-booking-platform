
<p-dialog 
    [header]="'📅 Program de lucru: ' + barberName() " 
    [(visible)]="visibleScheduleDialog" 
    [modal]="true" 
    [style]="{ width: '520px' }" 
    [draggable]="false" 
    [resizable]="false"
    (onHide)="onCancelSchedule.emit(); visibleScheduleDialog.set(false)"
>
    <div class="flex flex-col gap-4" [formGroup]="scheduleForm">
        <div formArrayName="days" class="flex flex-col gap-4">
            @for (dayControl of daysFormArray.controls; track dayControl; let i = $index) {
                <div [formGroupName]="i" class="flex items-center justify-between border-b border-slate-100 pb-3">		
                    
                    <div class="flex items-center gap-3 w-36">
                        <input 
                            type="checkbox" 
                            formControlName="is_active" 
                            class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer"
                        />
                        <span class="text-sm font-semibold" [class.text-slate-400]="!dayControl.get('is_active')?.value">
                            {{ daysLabels[dayControl.get('day_of_week')?.value] }}
                        </span>
                    </div>

                    @if (dayControl.get('is_active')?.value) {
                    <div class="flex items-center gap-2">
                        <input 
                            type="time" 
                            formControlName="start_hour" 
                            class="p-1.5 text-sm border rounded bg-white border-slate-300 text-center focus:outline-none focus:border-emerald-500 w-24" 
                            [ngClass]="{'border-red-500 bg-red-50 text-red-900': dayControl.hasError('invalidHours')}"
                        />
                        <span class="text-slate-400 text-xs font-bold">—</span>
                        <input 
                            type="time" 
                            formControlName="end_hour" 
                            class="p-1.5 text-sm border rounded bg-white border-slate-300 text-center focus:outline-none focus:border-emerald-500 w-24" 
                            [ngClass]="{'border-red-500 bg-red-50 text-red-900': dayControl.hasError('invalidHours')}"
                        />
                    </div>
                    } @else {
                    <span class="text-xs font-bold text-slate-400 bg-slate-100 px-4 py-1.5 rounded-full w-[210px] text-center tracking-wide">
                        LIBER / ÎNCHIS
                    </span>
                    }

                </div>
            }
        </div>  
    </div>  

    <ng-template pTemplate="footer">
        <p-button 
            label="Inchide" 
            severity="secondary" 
            [text]="true" 
            (onClick)="onCancelSchedule.emit(); visibleScheduleDialog.set(false)"
            size="small"
        ></p-button>
        <p-button 
            label="Aplică Programul" 
            severity="success" 
            (onClick)="saveSchedule()" 
            size="small"
        ></p-button>
    </ng-template>
</p-dialog>
