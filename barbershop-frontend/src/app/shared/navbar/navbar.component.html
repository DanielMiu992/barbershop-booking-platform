<p-menubar [model]="items()" 
        styleClass="w-full flex items-center justify-between bg-slate-900 border-none p-4 
                       [&>.p-menubar-start]:w-[15%] 
                       [&>.p-menubar-root-list]:w-[65%] [&>.p-menubar-root-list]:justify-center
                       [&>.p-menubar-end]:w-[20%]">
    <ng-template #start  >
        <a routerLink="/booking" class="text-xl font-bold tracking-wider text-emerald-400">
            BarberShop
        </a>
    </ng-template>
    <ng-template #item let-item>
        <div class="flex justify-start w-full">
            <a pRipple 
                routerLink="{{item.routerLink}}" 
                routerLinkActive="is-route-active"
                [routerLinkActiveOptions]="{ exact: true }"
                class="p-menubar-item-link flex items-center uppercase text-sm font-semibold gap-2"
                
            >
            <!-- 
                [class.bg-slate-400]="router.isActive(item.routerLink, { matrixParams: 'ignored', queryParams: 'ignored', paths: 'exact', fragment: 'ignored' })"
                [class.!text-emerald-400]="router.isActive(item.routerLink, { matrixParams: 'ignored', queryParams: 'ignored', paths: 'exact', fragment: 'ignored' })"
                [class.font-bold]="router.isActive(item.routerLink, { matrixParams: 'ignored', queryParams: 'ignored', paths: 'exact', fragment: 'ignored' })"
            -->
                <i class="{{item.icon}}" ></i>
                <span>{{item.label}}</span>
            </a>

        </div>
    </ng-template>
    <ng-template #end style="margin-left: 0;">
        <div class="flex items-center gap-3 justify-end w-full">
            @if (authService.currentUser()) {
                <span class="text-xs text-slate-400">Salut, {{ authService.currentUser()?.first_name }}</span>
            }
            <p-button 
                [label]="authService.currentUser() ? 'Logout' : 'Login'"
                [icon]="authService.currentUser() ? 'fa-solid fa-arrow-right-from-bracket' : 'fa-solid fa-arrow-right-to-bracket'"
                [severity]="authService.currentUser() ? 'danger' : 'primary'"
                (onClick)="onAuthButtonClick()"
                size="small"
                class="text-sm px-3 py-1.5 rounded transition"
            ></p-button>
        </div>

    </ng-template>
</p-menubar>
